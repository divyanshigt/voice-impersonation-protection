
name: AI Voice Detection CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend - Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        working-directory: backend
        run: |
          python -m compileall -q app tests

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest tests -q

  frontend-check:
    name: Frontend - React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  ci-success:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    if: success()

    steps:
      - name: Report success
        run: echo "Backend checks and frontend build passed."
